<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060d1b"/>
      <stop offset="100%" stop-color="#0a1728"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06ffa5"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="dot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06ffa5"/>
      <stop offset="100%" stop-color="#00d4e8"/>
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle inner border -->
  <rect width="63" height="63" x="0.5" y="0.5" rx="13.5" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <!-- N letterform -->
  <text
    x="9"
    y="50"
    font-family="'Space Grotesk', 'Manrope', system-ui, sans-serif"
    font-size="48"
    font-weight="700"
    letter-spacing="-2"
    fill="url(#letter)"
  >N</text>
  <!-- Accent dot (brand dot) -->
  <circle cx="53" cy="14" r="5" fill="url(#dot)"/>
</svg>
